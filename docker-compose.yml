services:
  intranet:
    build: .
    image: intranet-nk:latest
    container_name: intranet-nk
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - intranet_uploads:/app/static/uploads
      - intranet_academia_uploads:/app/academia/uploads
      - intranet_academia_reports:/app/academia/reports
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: intranet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intranet}
      POSTGRES_USER: ${POSTGRES_USER:-intranet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intranet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intranet} -d ${POSTGRES_DB:-intranet}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  intranet_uploads:
  intranet_academia_uploads:
  intranet_academia_reports:
  postgres_data:
