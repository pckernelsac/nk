<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página No Encontrada</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#5F2A5D',
                        'primary-dark': '#4a2048',
                        'primary-light': '#8b4789',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                        'slide-up': 'slideUp 0.8s ease-out forwards',
                        'bounce-slow': 'bounce 3s ease-in-out infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-primary-dark to-primary overflow-hidden relative">

    <!-- Decoración de fondo -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary-light rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-float"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-float" style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-float" style="animation-delay: 4s;"></div>
    </div>

    <!-- Contenedor Principal -->
    <div class="relative z-10 text-center px-6 max-w-4xl mx-auto animate-fade-in">

        <!-- Número 404 Grande -->
        <div class="mb-8 animate-slide-up" style="animation-delay: 0.2s;">
            <div class="relative inline-block">
                <!-- Efecto de sombra para el número -->
                <h1 class="text-[180px] md:text-[250px] font-extrabold leading-none bg-clip-text text-transparent bg-gradient-to-br from-white via-purple-200 to-primary-light drop-shadow-2xl">
                    404
                </h1>
                <!-- Icono decorativo -->
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-10">
                    <i class="fas fa-search text-[200px] text-white"></i>
                </div>
            </div>
        </div>

        <!-- Mensaje Principal -->
        <div class="mb-6 animate-slide-up" style="animation-delay: 0.4s;">
            <h2 class="text-3xl md:text-5xl font-bold text-white mb-4">
                ¡Oops! Página No Encontrada
            </h2>
            <p class="text-lg md:text-xl text-purple-200 max-w-2xl mx-auto leading-relaxed">
                La página que estás buscando no existe o fue movida a otra ubicación.
            </p>
        </div>

        <!-- Ilustración / Icono -->
        <div class="mb-10 animate-slide-up" style="animation-delay: 0.6s;">
            <div class="inline-flex items-center justify-center w-32 h-32 bg-white/10 backdrop-blur-lg rounded-full border-4 border-white/20 shadow-2xl animate-bounce-slow">
                <i class="fas fa-map-marked-alt text-6xl text-white"></i>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center animate-slide-up" style="animation-delay: 0.8s;">
            <!-- Botón Volver Atrás -->
            <button onclick="history.back()"
                    class="group px-8 py-4 bg-white hover:bg-gray-100 text-primary font-bold rounded-xl shadow-2xl transform hover:scale-105 transition-all duration-300 flex items-center gap-3">
                <i class="fas fa-arrow-left text-xl group-hover:-translate-x-1 transition-transform duration-300"></i>
                <span>Volver Atrás</span>
            </button>

            <!-- Botón Ir al Inicio -->
            <a href="{{ url_for('main.dashboard') if session.get('user_id') else url_for('auth.login') }}"
               class="group px-8 py-4 bg-gradient-to-r from-primary to-primary-dark hover:from-primary-dark hover:to-primary text-white font-bold rounded-xl shadow-2xl shadow-primary/50 transform hover:scale-105 transition-all duration-300 flex items-center gap-3">
                <i class="fas fa-home text-xl"></i>
                <span>Ir al Inicio</span>
                <i class="fas fa-arrow-right text-xl group-hover:translate-x-1 transition-transform duration-300"></i>
            </a>
        </div>

        <!-- Información Adicional -->
        <div class="mt-12 animate-slide-up" style="animation-delay: 1s;">
            <div class="inline-block bg-white/5 backdrop-blur-lg border border-white/10 rounded-2xl px-6 py-4">
                <p class="text-purple-200 text-sm">
                    <i class="fas fa-info-circle mr-2"></i>
                    Si crees que esto es un error, contacta al administrador del sistema
                </p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="absolute bottom-6 left-0 right-0 text-center z-10 animate-fade-in" style="animation-delay: 1.2s;">
        <p class="text-white/50 text-sm">
            &copy; {{ current_year }} Sistema de Gestión Escolar | Error 404
        </p>
    </div>

    <script>
        // Animación de partículas sutiles en el fondo
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('body');

            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'absolute w-2 h-2 bg-white/20 rounded-full';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animation = `float ${5 + Math.random() * 5}s ease-in-out infinite`;
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        });
    </script>
</body>
</html>
